name: CI/CD - Test and Build

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './equipe4/package-lock.json'

      - name: Install dependencies
        working-directory: ./equipe4
        run: npm ci

      - name: Run unit tests
        working-directory: ./equipe4
        run: npm run test -- --run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: equipe4/coverage/
          retention-days: 7

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './equipe4/package-lock.json'

      - name: Install dependencies
        working-directory: ./equipe4
        run: npm ci

      - name: Build application
        working-directory: ./equipe4
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: equipe4/dist/
          retention-days: 7

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './equipe4/package-lock.json'

      - name: Install dependencies
        working-directory: ./equipe4
        run: npm ci

      - name: Check for linting errors (if configured)
        working-directory: ./equipe4
        run: |
          if grep -q "\"lint\"" package.json; then
            npm run lint || echo "Linting not configured or failed"
          else
            echo "No lint script found, skipping"
          fi
        continue-on-error: true
